unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Make leader ctr + space
set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

set-option -g status-position top

# Movment
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# Gruvbox theme
set -g status-right-length 100
set -g status-left-length 100
set -g status-interval 5

set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left "#[fg=#282828,bg=#b8bb26,bold] #S #[fg=#b8bb26,bg=#282828,nobold] "
set -g status-right "#[fg=#fabd2f,bg=#282828] CPU #{cpu_percentage} #[fg=#8ec07c] BAT #{battery_percentage} #[fg=#83a598] %Y-%m-%d %H:%M "

setw -g window-status-format "#[fg=#a89984,bg=#282828] #I:#W "
setw -g window-status-current-format "#[fg=#282828,bg=#fabd2f,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#504945,fg=#ebdbb2"
set -g mode-style "bg=#665c54,fg=#fbf1c7"
set -g clock-mode-colour "#fabd2f"

run-shell '~/.config/tmux/plugins/tmux-cpu/cpu.tmux'
run-shell '~/.config/tmux/plugins/tmux-battery/battery.tmux'


# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
